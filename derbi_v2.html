<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Derbi CANLI v2 · TikTok yayın</title>
<style>
:root{--gs1:#f5b400;--gs2:#c8102e;--fb1:#ffe600;--fb2:#002d72;--panel:#0f1521ee}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#fff}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;background:#05070b}
#gl{position:absolute;inset:0;width:1080px;height:1920px;display:block}

/* skor */
.top{position:absolute;left:30px;right:30px;top:300px;display:flex;height:110px;border-radius:16px;overflow:hidden;font-weight:700;box-shadow:0 10px 30px #000a}
.top .live{background:#e0102a;display:flex;align-items:center;padding:0 24px;font-size:30px;gap:12px}
.top .live i{width:16px;height:16px;border-radius:50%;background:#fff;animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.2}}
.top .t{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:48px;line-height:1;text-shadow:0 2px 4px #0008}
.top .t small{font-size:22px;margin-top:6px;background:#000a;padding:3px 10px;border-radius:8px;text-shadow:none}
.top .gs{background:linear-gradient(135deg,var(--gs1) 0 50%,var(--gs2) 50%)}
.top .fb{background:linear-gradient(135deg,var(--fb1) 0 50%,var(--fb2) 50%)}
.top .sc{background:#111827;display:flex;align-items:center;padding:0 30px;font-size:70px;font-variant-numeric:tabular-nums}
.top .clk{background:#1f2937;display:flex;align-items:center;padding:0 22px;font-size:40px;color:#ffe08a;font-variant-numeric:tabular-nums}
/* talimat */
.howto{position:absolute;left:30px;right:30px;top:418px;height:60px;border-radius:16px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;gap:12px;box-shadow:0 10px 30px #0009;z-index:5}
.howto b{background:#111;color:#ffe08a;padding:4px 16px;border-radius:10px}
/* taraftar şeridi + roller */
.strip{position:absolute;left:30px;right:30px;top:382px;height:72px;display:flex;gap:10px}
.strip .tm{flex:1;border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:26px;font-weight:700;white-space:nowrap;overflow:hidden;box-shadow:0 6px 20px #0008}
.strip .tm.gs{background:linear-gradient(90deg,#c8102eee,#a07400ee)}
.strip .tm.fb{background:linear-gradient(90deg,#002d72ee,#1d4ed8ee)}
.strip .tm b{font-size:30px}
.strip .tm span{overflow:hidden;text-overflow:ellipsis}
.roles{position:absolute;left:30px;right:30px;top:486px;height:46px;display:flex;gap:8px;justify-content:center}
.roles div{background:#000000b8;border-radius:23px;padding:0 16px;font-size:22px;display:flex;align-items:center;gap:6px;white-space:nowrap;max-width:340px;overflow:hidden}
.roles b{color:#ffe08a;overflow:hidden;text-overflow:ellipsis}
.roles .emp{color:#9ca3af;font-weight:400}
/* taraftar kayan şeridi */
.fanbar{position:absolute;left:0;right:0;top:1124px;height:44px;background:#000000b0;border-top:2px solid #ffffff22;border-bottom:2px solid #ffffff22;overflow:hidden;white-space:nowrap;display:flex;align-items:center;z-index:4}
.fanbar .lbl{flex:none;background:#ffe08a;color:#000;font-weight:900;font-size:20px;letter-spacing:2px;padding:0 14px;height:100%;display:flex;align-items:center;z-index:2}
.fanbar .mvw{position:relative;flex:1;height:100%;overflow:hidden}
.fanbar .mv{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;white-space:nowrap;font-size:24px;font-weight:700;will-change:transform}
.fanbar .mv span{padding-right:34px;flex:none}
.fanbar .mv i{font-style:normal;display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:1px}
@keyframes fanmq{to{transform:translateX(-100%)}}
/* yan paneller (örnek yayınlardaki gibi) */
.side{position:absolute;top:546px;background:#0b0f179c;border:2px solid #ffffff22;border-radius:18px;padding:10px 12px;box-shadow:0 10px 30px #000a;backdrop-filter:blur(4px)}
.side h4{margin:0 0 6px;font-size:18px;letter-spacing:3px;color:#ffe08a;text-align:center}
.side.l{left:10px;width:210px}
.side.r{right:10px;width:262px}
.gr{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:10px}
.gr .e{font-size:28px;width:34px;text-align:center;flex:none}
.gr .t{flex:1;min-width:0}
.gr .t b{display:block;font-size:19px;line-height:1.1}
.gr .t i{display:block;font-size:16px;line-height:1.15;color:#cbd5e1;font-style:italic}
.gr .p{font-size:18px;color:#ffe08a;font-weight:700;white-space:nowrap}
.gr.cmd .e{font-size:28px}
.gr.hot{animation:hot 1.4s ease-out}
.lb{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:18px;font-weight:700}
.lb .r{width:26px;text-align:center;color:#ffe08a}
.lb .av{position:relative;width:32px;height:32px;border-radius:50%;background:#374151;display:grid;place-items:center;font-size:15px;flex:none;overflow:hidden;border:3px solid var(--tc)}
.lb .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lb .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px}
.lb.emp{color:#9ca3af;font-weight:400;font-size:19px}
.join{margin-top:8px;border-top:1px solid #ffffff22;padding-top:6px;text-align:center;font-size:18px;font-weight:700}
.join b{background:#ffe08a;color:#000;padding:2px 10px;border-radius:8px}
@keyframes hot{0%{background:#ffe08acc;transform:scale(1.06)}100%{background:transparent;transform:none}}
/* olay kutusu */
.event{position:absolute;left:90px;right:90px;top:1170px;background:#0b0f17f2;border:5px solid var(--tc,#ffe08a);border-radius:60px;padding:6px 26px 6px 8px;height:116px;display:flex;align-items:center;gap:20px;box-shadow:0 10px 30px #000c;opacity:0;transform:translateY(12px);transition:opacity .25s,transform .35s cubic-bezier(.2,1.5,.4,1);z-index:20}
.event.show{opacity:1;transform:none}
.event.glow{animation:evglow 1s ease-in-out infinite alternate}

@keyframes evglow{from{box-shadow:0 0 16px var(--tc),0 10px 30px #000c}to{box-shadow:0 0 48px var(--tc),0 0 90px var(--tc),0 10px 30px #000c}}
.fanbar .mv span.hi{color:#ffd1ea;text-shadow:0 0 10px #ff6fb5,0 0 20px #ff6fb5}
.event .av{position:relative;width:96px;height:96px;border-radius:50%;background:#374151;border:6px solid var(--tc,#ffe08a);display:grid;place-items:center;font-size:24px;font-weight:700;flex:none;overflow:hidden}
.event .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.event h2{margin:0;font-size:38px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:860px}
.event p{margin:2px 0 0;font-size:26px;font-style:italic;color:#ffe08a;font-weight:700}
/* gol */
.goal{position:absolute;inset:0;display:none;place-items:center;z-index:50;text-align:center;pointer-events:none}
.goal.show{display:grid}
.goal .band{position:absolute;left:0;right:0;top:33%;height:260px;background:linear-gradient(90deg,transparent,var(--tc) 20%,var(--tc) 80%,transparent);opacity:.92;transform:translateY(-50%) skewY(-4deg);animation:band .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes band{from{transform:translateY(-50%) scaleX(0)}}
.goal h1{position:absolute;left:0;right:0;top:33%;transform:translateY(-50%);font-size:280px;margin:0;line-height:1;font-weight:900;color:#fff;text-shadow:0 10px 0 #0005,0 0 60px #0008}
.goal .who{position:absolute;left:0;right:0;top:44%}
.goal .star{width:220px;height:220px;margin:0 auto 14px;border-radius:50%;border:10px solid #ffd54a;box-shadow:0 0 0 8px var(--tc),0 0 80px #ffd54a;overflow:hidden;position:relative;background:#374151;display:grid;place-items:center;font-size:90px;font-weight:700;animation:starin .7s cubic-bezier(.2,1.6,.4,1)}
.goal .star img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@keyframes starin{from{transform:scale(0) rotate(-30deg)}}
.goal .tag{display:inline-block;background:#ffd54a;color:#000;font-weight:900;font-size:40px;padding:6px 26px;border-radius:12px;margin-bottom:10px;letter-spacing:2px}
.spark{position:absolute;font-size:60px;animation:spark 1.6s ease-out forwards}
@keyframes spark{from{transform:scale(.2);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
.goal .who b{font-size:64px;display:block;text-shadow:0 4px 12px #000}
.goal .who span{font-size:36px;color:#ffe08a;text-shadow:0 2px 8px #000;font-weight:700}
.cf{position:absolute;width:14px;height:24px;top:-30px;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(2100px) rotate(900deg)}}
/* tezahürat */
.chant{position:absolute;left:0;right:0;top:470px;text-align:center;font-size:54px;font-weight:900;letter-spacing:2px;opacity:0;transition:opacity .3s;z-index:15;text-shadow:0 4px 0 #000,0 0 30px #000}
.chant.show{opacity:1;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.snd{position:absolute;left:50%;top:960px;transform:translateX(-50%);background:#000c;padding:8px 16px;border-radius:8px;font-size:22px;color:#ffe08a;z-index:30}
/* kontrol paneli */
#panel{position:fixed;right:10px;bottom:10px;background:#111d;border:1px solid #444;border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;max-width:340px;font-size:13px;z-index:99;font-family:system-ui,sans-serif}
#panel button{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid #555;background:#222;color:#fff;cursor:pointer}
#panel .st{width:100%;color:#aaa}
#panel .st i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#c33;margin-right:6px}
#panel .st i.ok{background:#3c3}
#panel input{width:150px;font:inherit;padding:6px;border-radius:8px;border:1px solid #555;background:#222;color:#fff}
.hide{display:none!important}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div class="top"><div class="live"><i></i>CANLI</div><div class="t gs">GS<small><span id="cntG">0</span> taraftar</small></div><div class="sc"><span id="sGs">0</span>&nbsp;–&nbsp;<span id="sFb">0</span></div><div class="t fb">FB<small><span id="cntF">0</span> taraftar</small></div><div class="clk" style="flex-direction:column;justify-content:center;line-height:1"><span id="clk">00:00</span><small id="half" style="font-size:18px;color:#cbd5e1;margin-top:6px">1. YARI</small></div></div>
  <div class="chant" id="chant"></div>
    <div class="howto">💬 Sohbete <b>GS</b> ya da <b>FB</b> yaz → takımına katıl</div>
  <div class="roles"><div>🟨 Hakem: <b id="rRef"></b></div><div>🧢 GS: <b id="rTdG"></b></div><div>🧢 FB: <b id="rTdF"></b></div></div>
  <div class="side l"><h4>🏆 ŞEREF KÜRSÜSÜ</h4><div id="lb"></div></div>
  <div class="side r"><h4>🎁 HEDİYE GÖNDER</h4><div id="giftList"></div></div>
  <div class="fanbar"><div class="lbl">TRİBÜN</div><div class="mvw" id="fanW"><div class="mv" id="fanMv"></div></div></div>
  <div class="event" id="event"><div class="av" id="evAv"></div><div><h2 id="evName"></h2><p id="evText"></p></div></div>
  <div class="snd" id="snd">🔇 Ses için tıkla</div>
  <div class="goal" id="goal"><div class="band"></div><h1>GOL!</h1><div class="who"><div class="star" id="gStar"></div><div class="tag">⭐ MAÇIN YILDIZI ⭐</div><b id="gName"></b><span id="gText"></span></div></div>
</div>

<div id="panel">
  <div class="st"><i id="wsDot"></i><span id="wsTxt">Köprü yok (ws://localhost:8765)</span></div>
  <input id="pName" placeholder="isim (boş = rastgele)">
  <button data-ev="join">Katılım</button><button data-ev="gs">Yorum GS</button><button data-ev="fb">Yorum FB</button>
  <button data-ev="g1">Gül 1</button><button data-ev="g30">Donut 30</button><button data-ev="g100">El Kalp 100</button>
  <button data-ev="ref">"hakem"</button><button data-ev="td">"hoca"</button><button data-ev="g199">Gözlük 199</button><button data-ev="g299">Corgi 299</button><button data-ev="g500">Tabanca 500</button>
  <button id="reset">Sıfırla</button><button id="hide">Paneli gizle</button>
</div>

<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

/* ================= AYARLAR ================= */
// Jeton eşikleri (tek seferde gönderilen). Hediye adları yalnızca tabloda görünür.
const CONFIG={chant:30,player:100,ref:199,role:299,goal:500,squad:5,matchMin:10,idleMin:10,ws:'ws://localhost:8765',key:'derbi_v2'};
const GIFT_TABLE=[
  {e:'🌹',n:'Gül',c:'1 jeton',d:'Adın ekranda parlar'},
  {e:'🍩',n:'Donut',c:`${CONFIG.chant} jeton`,d:'Marş çalar'},
  {e:'🫶',n:'El Kalp',c:`${CONFIG.player} jeton`,d:'Sahaya çık'},
  {e:'🕶️',n:'Güneş Gözlüğü',c:`${CONFIG.ref} jeton`,d:'Maçın hakemi ol'},
  {e:'🐶',n:'Corgi',c:`${CONFIG.role} jeton`,d:'Takımının hocası ol'},
  {e:'🔫',n:'Para Tabancası',c:`${CONFIG.goal} jeton`,d:'GOL at!'},
  {e:'👑',n:'En çok gönderen',c:'her takımda',d:'Kaptan olur'},
];
const TEAM={gs:{c:'#f5b400',c2:'#c8102e',n:'Galatasaray',crowd:['#f5b400','#c8102e','#8a0e22','#d9a300','#f5b400','#1a1a1a'],side:-1},
            fb:{c:'#ffe600',c2:'#002d72',n:'Fenerbahçe',crowd:['#ffe600','#002d72','#0b3d91','#e6cf00','#002d72','#1a1a1a'],side:1}};
const params=new URLSearchParams(location.search);
if(params.get('ws'))CONFIG.ws=params.get('ws');
const SIM=+params.get('sim')||0;
if(SIM){CONFIG.key='derbi_v2_sim';try{localStorage.removeItem(CONFIG.key)}catch(e){}}
const $=s=>document.querySelector(s);
const PL=72,PW=46; // halı saha boyutu

/* ================= DURUM ================= */
let S={users:{},goals:{gs:0,fb:0},start:Date.now(),refId:null,td:{gs:null,fb:null}};
try{const raw=localStorage.getItem(CONFIG.key);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(CONFIG.key,JSON.stringify(S))}catch(e){}}
let flip=0;
const members=t=>Object.values(S.users).filter(u=>u.team===t);
function autoTeam(){const g=members('gs').length,f=members('fb').length;if(g!==f)return g<f?'gs':'fb';return (flip++%2)?'fb':'gs'}
function getUser(u){const id=String(u.id||u.name);let x=S.users[id];
  if(!x)x=S.users[id]={id,name:u.name||id,avatar:u.avatar||null,team:null,coins:0,joined:Date.now(),last:0};
  if(u.avatar&&u.avatar!==x.avatar){x.avatar=u.avatar;const a=actors.get(id);if(a)a.refresh()}
  if(u.name)x.name=u.name;return x}
function parseTeam(t){t=(t||'').toLocaleLowerCase('tr-TR');
  if(/(^|[^a-zçğıöşü])(gs|galatasaray|cimbom|cim bom|aslan)([^a-zçğıöşü]|$)/.test(t))return 'gs';
  if(/(^|[^a-zçğıöşü])(fb|fener|fenerbahçe|fenerbahce|kanarya)([^a-zçğıöşü]|$)/.test(t))return 'fb';return null}
function parseRole(t){t=(t||'').toLocaleLowerCase('tr-TR');if(/hakem/.test(t))return 'ref';if(/hoca|teknik|direktör|direktor/.test(t))return 'td';return null}

/* ================= THREE: SAHNE ================= */
const canvas=$('#gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(1);renderer.setSize(1080,1920,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x05070b);scene.fog=new THREE.FogExp2(0x070a10,0.0028);
const camera=new THREE.PerspectiveCamera(30,1080/1920,1,900);
// Saha ekranın üst yarısında (talimat ile hocalar arası) dursun diye görüntüyü yukarı kaydır
camera.setViewOffset(1080,1920,0,200,1080,1920);
scene.add(new THREE.HemisphereLight(0xcfe0ff,0x1a2a1a,1.15));
const sun=new THREE.DirectionalLight(0xfff4e0,1.9);sun.position.set(-30,90,40);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-50,right:50,top:40,bottom:-40,near:10,far:250});sun.shadow.bias=-0.0005;sun.shadow.normalBias=0.03;scene.add(sun);
const sun2=new THREE.DirectionalLight(0xdde8ff,0.7);sun2.position.set(-60,60,-40);scene.add(sun2);
function cnv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function tex(c,repeat){const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping}return t}

/* çim + çizgiler (biçilmiş çim deseni) */
(()=>{const s=24,m=8,c=cnv((PL+2*m)*s,(PW+2*m)*s),x=c.getContext('2d');const ox=m*s,oy=m*s;
  x.fillStyle='#1d5c25';x.fillRect(0,0,c.width,c.height);
  const SW=4.5;for(let i=0;i*SW<PL+2*m;i++){x.fillStyle=i%2?'#3b9a45':'#2f8a3b';x.fillRect(i*SW*s,0,SW*s,c.height)}
  // hafif çapraz desen
  x.globalAlpha=0.08;for(let j=0;j*SW<PW+2*m;j++){if(j%2){x.fillStyle='#ffffff';x.fillRect(0,j*SW*s,c.width,SW*s)}}x.globalAlpha=1;
  const img=x.getImageData(0,0,c.width,c.height),d=img.data;for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*18;d[i]+=n*.6;d[i+1]+=n;d[i+2]+=n*.6}x.putImageData(img,0,0);
  x.strokeStyle='#f6faf6';x.lineWidth=0.28*s;x.shadowColor='#ffffff88';x.shadowBlur=6;const R=(a,b,w,h)=>x.strokeRect(ox+a*s,oy+b*s,w*s,h*s);
  R(0,0,PL,PW);x.beginPath();x.moveTo(ox+PL/2*s,oy);x.lineTo(ox+PL/2*s,oy+PW*s);x.stroke();
  x.beginPath();x.arc(ox+PL/2*s,oy+PW/2*s,7*s,0,7);x.stroke();x.fillStyle='#f6faf6';x.beginPath();x.arc(ox+PL/2*s,oy+PW/2*s,0.35*s,0,7);x.fill();
  for(const side of [0,1]){R(side?PL-12:0,(PW-26)/2,12,26);R(side?PL-4.5:0,(PW-12)/2,4.5,12);x.beginPath();x.arc(ox+(side?PL-8.5:8.5)*s,oy+PW/2*s,0.35*s,0,7);x.fill();
    x.beginPath();x.arc(ox+(side?PL-8.5:8.5)*s,oy+PW/2*s,6*s,side?Math.PI-0.85:-0.85,side?Math.PI+0.85:0.85);x.stroke()}
  for(const [a,b] of [[0,0],[PL,0],[0,PW],[PL,PW]]){x.beginPath();x.arc(ox+a*s,oy+b*s,1*s,0,7);x.stroke()}
  const t=tex(c);t.anisotropy=16;
  const g=new THREE.Mesh(new THREE.PlaneGeometry(PL+2*m,PW+2*m),new THREE.MeshStandardMaterial({map:t,roughness:0.95,metalness:0}));g.rotation.x=-Math.PI/2;g.receiveShadow=true;scene.add(g);
  const ap=new THREE.Mesh(new THREE.PlaneGeometry(PL+80,PW+80),new THREE.MeshStandardMaterial({color:0x1a4d22,roughness:1}));ap.rotation.x=-Math.PI/2;ap.position.y=-0.02;ap.receiveShadow=true;scene.add(ap);
  // köşe bayrakları
  for(const [a,b] of [[-1,-1],[1,-1],[-1,1],[1,1]]){const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,2.2,6),new THREE.MeshStandardMaterial({color:0xffffff}));pole.position.set(a*PL/2,1.1,b*PW/2);pole.castShadow=true;scene.add(pole);
    const fl=new THREE.Mesh(new THREE.PlaneGeometry(0.9,0.6),new THREE.MeshStandardMaterial({color:a<0?0xc8102e:0x002d72,side:THREE.DoubleSide}));fl.position.set(a*PL/2+0.45,1.9,b*PW/2);scene.add(fl)}
})();
/* teknik alanlar: hocalar bu çizgili kutunun içinde durur */
for(const sz of [-1,1]){const z0=sz*(PW/2-3.5),x0=-31,w=10,d=4.2;const lm=new THREE.MeshBasicMaterial({color:0xffffff});
  for(const [x,z,sx,sz2] of [[x0,z0-d/2,w,0.18],[x0,z0+d/2,w,0.18],[x0-w/2,z0,0.18,d],[x0+w/2,z0,0.18,d]]){const l=new THREE.Mesh(new THREE.PlaneGeometry(sx,sz2),lm);l.rotation.x=-Math.PI/2;l.position.set(x,0.03,z);scene.add(l)}

    setTimeout(()=>{if(a)shoot(a,now(),true);else kickTo(side*(PL/2+1.2),0,0.9);play.next=now()+99;goalCam(side,1600)},1800);
    // 1) GOL anı: şarkı, konfeti, büyük yazı
    setTimeout(()=>{S.goals[u.team]+=g;save();hud();SFX.goal();goalSong(u.team,9);cheer[u.team]=now()+10;excite=1;
      const G=$('#goal');G.style.setProperty('--tc',TEAM[u.team].c2);$('#gName').textContent=u.name;$('#gText').textContent=`${TEAM[u.team].n} için ${g>1?g+' gol':'gol'} attı!`;
      $('#gStar').innerHTML=avHTML(u);G.classList.add('show');confetti(u.team);sparks();
      // 2) golcü köşe bayrağına koşar, takım arkadaşları üstüne gelir, kamera onu takip eder
      if(a){a.celeb=now()+9;a.jump=0;const cz=(a.pos.z>=0?1:-1)*(PW/2-3);a.target.set(side*(PL/2-4),0,cz);
        fieldActors(u.team).filter(x=>x!==a&&x.opts.num!==1).forEach((m,i)=>{m.celeb=now()+9;m.target.set(side*(PL/2-8)-side*i*1.5,0,cz-(cz>0?1:-1)*(3+i*1.6))});
        camOverride={follow:a,side,pos:new THREE.Vector3(),look:new THREE.Vector3(),until:performance.now()+8500};
        setTimeout(()=>{a.jump=5.5},1800)}},2600);
    setTimeout(()=>sparks(),4600);setTimeout(()=>sparks(),6600);
    setTimeout(()=>{$('#goal').classList.remove('show');event(u,'⭐ MAÇIN YILDIZI · gol sevinci!',3)},6400);
    // 3) orta
    setTimeout(()=>{goalBusy=false;camOverride=null;for(const x of fieldActors())x.celeb=0;const opp=oppOf(u.team);kickTo(0,0,0.8);
      setTimeout(()=>{startBuild(now(),opp,fieldActors(opp).find(x=>x.opts.num===10)||fieldActors(opp)[0]);SFX.whistle(1)},900)},12200)};
  goalChain=goalChain.then(()=>new Promise(res=>{run();setTimeout(res,12600)}))}
function sparks(){const G=$('#goal');for(let i=0;i<14;i++){const e=document.createElement('div');e.className='spark';e.textContent=i%3?'⭐':'✨';e.style.left='490px';e.style.top='950px';
  const ang=Math.random()*Math.PI*2,r=220+Math.random()*260;e.style.setProperty('--dx',Math.cos(ang)*r+'px');e.style.setProperty('--dy',Math.sin(ang)*r+'px');G.appendChild(e);setTimeout(()=>e.remove(),1700)}}
function confetti(t){const G=$('#goal');for(let i=0;i<90;i++){const c=document.createElement('div');c.className='cf';c.style.left=Math.random()*1080+'px';c.style.background=i%2?TEAM[t].c:TEAM[t].c2;c.style.animationDelay=(Math.random()*1.4)+'s';G.appendChild(c);setTimeout(()=>c.remove(),4600)}}

/* ================= PANELLER ================= */
const GL=[...GIFT_TABLE.slice(0,6).map((g,i)=>`<div class="gr" id="gt${i}"><div class="e">${g.e}</div><div class="t"><b>${g.n}</b><i>${g.d}</i></div><div class="p">${g.c.replace(' jeton','')}</div></div>`),
  `<div class="gr cmd"><div class="e">👑</div><div class="t"><b>En çok gönderen</b><i>Kaptan olur</i></div></div>`,
];
$('#giftList').innerHTML=GL.join('');
function hotTile(i){const el=document.getElementById('gt'+i);if(!el)return;el.classList.remove('hot');void el.offsetWidth;el.classList.add('hot')}
function fanList(t){const all=members(t);const top=all.filter(u=>u.coins>0).sort((a,b)=>b.coins-a.coins);const fresh=all.filter(u=>!u.coins).sort((a,b)=>b.last-a.last);
  const rows=[...top.slice(0,3),...fresh].slice(0,4);
  if(!rows.length)return `<div class="emptyc">Henüz kimse yok.<br>Sohbete <b>${t==='gs'?'GS':'FB'}</b> yaz, ilk taraftar sen ol!</div>`;
  const now=Date.now();
  return rows.map((u,i)=>`<div class="row${glowUntil[u.id]>now?' glow':''}"><div class="av">${avHTML(u)}</div><div class="nm">${u.name}</div><div class="pt${u.coins?'':' new'}">${u.coins?(i===0?'👑 ':'')+u.coins.toLocaleString('tr-TR'):'yeni'}</div></div>`).join('')+(all.length>rows.length?`<div class="more">+${all.length-rows.length} kişi daha</div>`:'')}
const nm=id=>id&&S.users[id]?S.users[id].name:null;
function leaderboard(){const top=Object.values(S.users).filter(u=>u.coins>0).sort((a,b)=>b.coins-a.coins).slice(0,6);
  $('#lb').innerHTML=top.length?top.map((u,i)=>`<div class="lb" style="--tc:${TEAM[u.team]?TEAM[u.team].c:'#888'}"><div class="r">${['🥇','🥈','🥉'][i]||i+1}</div><div class="av">${avHTML(u)}</div><div class="n">${u.name}</div></div>`).join(''):'<div class="lb emp">İlk hediyeyi gönder,<br>en üstte sen ol!</div>'}
/* tribün şeridi: sürekli akar. Yeni gelenler sıraya girer ve sona eklenir; sıra boşsa taraftarlar sırayla tekrar geçer. */
const fanQ=[];let fanRot=0,fanX=0,fanLast=performance.now();
function fanPush(u,hi){if(u&&u.team)fanQ.unshift(hi?{id:u.id,hi:true}:{id:u.id})}
function fanNextId(){if(fanQ.length)return fanQ.shift();const all=Object.values(S.users).filter(u=>u.team);if(!all.length)return null;fanRot=(fanRot+1)%all.length;return {id:all[fanRot].id}}
function fanTick(){requestAnimationFrame(fanTick);const now=performance.now(),dt=Math.min(.1,(now-fanLast)/1000);fanLast=now;
  const el=$('#fanMv'),W=$('#fanW').clientWidth;fanX-=dt*80;
  while(el.firstChild&&fanX+el.firstChild.offsetWidth<0){fanX+=el.firstChild.offsetWidth;el.firstChild.remove()}
  let guard=0;while(el.scrollWidth+fanX<W+40&&guard++<5){const nx=fanNextId();const u=nx&&S.users[nx.id];
    const sp=document.createElement('span');
    if(u){if(nx.hi)sp.className='hi';sp.innerHTML=`<i style="background:${TEAM[u.team].c};box-shadow:0 0 0 3px ${TEAM[u.team].c2}"></i>${u.name.replace(/</g,'&lt;')}`}
    else{sp.textContent='Sohbete GS ya da FB yaz, adın burada aksın!'}
    if(!el.childNodes.length&&fanX<=0)fanX=W;el.appendChild(sp);if(!u)break}
  el.style.transform=`translateX(${fanX}px)`}
requestAnimationFrame(fanTick);
function fanbar(){}
function hud(){leaderboard();fanbar();$('#sGs').textContent=S.goals.gs;$('#sFb').textContent=S.goals.fb;
  $('#cntG').textContent=members('gs').length;$('#cntF').textContent=members('fb').length;
  
  const set=(el,v,hint)=>{el.textContent=v||hint;el.className=v?'':'emp'};
  set($('#rRef'),nm(S.refId),'BOŞ – 🕶️ Gözlük gönder');set($('#rTdG'),nm(S.td.gs),'BOŞ – 🐶 Corgi gönder');set($('#rTdF'),nm(S.td.fb),'BOŞ – 🐶 Corgi gönder')}
let halfShown=false,ftBusy=false;
function clock(){if(ftBusy)return;const real=(Date.now()-S.start)/1000;const gsec=Math.floor(real*90*60/(CONFIG.matchMin*60)); // oyun saniyesi
  const m=Math.floor(gsec/60);$('#clk').textContent=String(Math.min(90,m)).padStart(2,'0')+':'+String(m>=90?0:gsec%60).padStart(2,'0');
  $('#half').textContent=m<45?'1. YARI':'2. YARI';
  if(m>=45&&!S.half2){S.half2=true;save();SFX.whistle(2);event({name:'Hakem',team:null},'İlk yarı bitti · 2. YARI BAŞLIYOR!',3)}
  if(m>=90&&!goalBusy)fullTime();
  // koltuklar: uzun süre ses vermeyen hakem/hoca yayından çıkmış sayılır, koltuk boşalır
  const idle=id=>{const u=id&&S.users[id];return u&&Date.now()-(u.seen||u.joined)>CONFIG.idleMin*60000};
  if(idle(S.refId)){event(S.users[S.refId],'yayından ayrıldı · hakem koltuğu boş!',1);S.refId=null;layout();hud();save()}
  for(const t of ['gs','fb'])if(idle(S.td[t])){event(S.users[S.td[t]],`yayından ayrıldı · ${TEAM[t].n} hocalığı boş!`,1);S.td[t]=null;layout();hud();save()}}
function fullTime(){ftBusy=true;goalBusy=true;SFX.whistle(3);const g=S.goals.gs,f=S.goals.fb;const w=g>f?'gs':f>g?'fb':null;
  const G=$('#goal');G.style.setProperty('--tc',w?TEAM[w].c2:'#374151');G.querySelector('h1').textContent='MAÇ SONU';
  $('#gStar').innerHTML='🏆';$('#gName').textContent=`GS ${g} – ${f} FB`;$('#gText').textContent=w?`${TEAM[w].n} KAZANDI!`:'Berabere!';G.classList.add('show');if(w){confetti(w);goalSong(w,9);cheer[w]=performance.now()/1000+12}
  setTimeout(()=>{G.classList.remove('show');G.querySelector('h1').textContent='GOL!';
    // yeni maç: skor, jetonlar ve koltuklar sıfırlanır; taraftarlar takımlarında kalır
    S.goals={gs:0,fb:0};S.start=Date.now();S.half2=false;S.refId=null;S.td={gs:null,fb:null};for(const u of Object.values(S.users))u.coins=0;save();layout();hud();
    ftBusy=false;goalBusy=false;SFX.whistle(1);event({name:'Yeni maç',team:null},'Başladı! Sahaya çıkmak için El Kalp gönder',3);startBuild(performance.now()/1000,'gs',fieldActors('gs').find(a=>a.opts.num===10))},15000)}
setInterval(clock,1000);setInterval(hud,1000);

/* ================= DÖNGÜ ================= */
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);$('#stage').style.transform=`translate(${(innerWidth-1080*s)/2}px,${(innerHeight-1920*s)/2}px) scale(${s})`}
addEventListener('resize',fit);fit();setInterval(fit,500);
let last=performance.now();
function loop(){requestAnimationFrame(loop);const now=performance.now();const dt=Math.min(.25,(now-last)/1000);last=now;const t=now/1000;
  excite=Math.max(0.15,excite-dt*0.05);animCrowd(t);
  for(const [id,a] of actors){a.update(dt,t);if(a.zone==='off'&&now>a.offAt){a.hide();actors.delete(id)}}
  updateBall(dt,t);updateCam(dt);renderer.render(scene,camera)}
layout();hud();clock();loop();startBuild(performance.now()/1000,'gs',fieldActors('gs').find(a=>a.opts.num===10));

/* ================= KÖPRÜ ================= */
function connect(){let ws;try{ws=new WebSocket(CONFIG.ws)}catch(e){return setTimeout(connect,4000)}
  ws.onopen=()=>{$('#wsDot').classList.add('ok');$('#wsTxt').textContent='TikTok köprüsü bağlı'};
  ws.onmessage=m=>{try{handle(JSON.parse(m.data))}catch(e){console.error(e)}};
  ws.onclose=()=>{$('#wsDot').classList.remove('ok');$('#wsTxt').textContent='Köprü yok (ws://localhost:8765)';setTimeout(connect,4000)};ws.onerror=()=>ws.close()}
if(!SIM)connect();

/* ================= TEST PANELİ ================= */
const NAMES=['Ali K.','Merve T.','Can Y.','Zeynep A.','Burak S.','Elif D.','Emre Ç.','Selin O.','Kaan B.','Deniz U.'];
const demoUser=n=>{n=n||NAMES[Math.floor(Math.random()*NAMES.length)];return{id:'demo_'+n,name:n,avatar:`https://api.dicebear.com/9.x/avataaars/png?seed=${encodeURIComponent(n)}&size=160&backgroundColor=b6e3f4,c0aede,ffd5dc,ffdfbf`}};
document.querySelectorAll('#panel [data-ev]').forEach(b=>b.onclick=()=>{const u=demoUser($('#pName').value.trim());const k=b.dataset.ev;

  else handle({type:'gift',user:u,coins:+k.slice(1),gift:{g1:'Gül',g30:'Donut',g100:'El Kalp',g199:'Güneş Gözlüğü',g299:'Corgi',g500:'Para Tabancası'}[k]})});
$('#reset').onclick=()=>{if(confirm('Her şey sıfırlansın mı?')){localStorage.removeItem(CONFIG.key);location.reload()}};
$('#hide').onclick=()=>$('#panel').classList.add('hide');
if(params.get('overlay')==='1')$('#panel').classList.add('hide');
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='h')$('#panel').classList.toggle('hide');if(e.key==='m'){AU.muted=!AU.muted;if(AU.master)AU.master.gain.value=AU.muted?0:0.9}});

/* ================= CANLI YAYIN SİMÜLASYONU (?sim=50) ================= */
function startSim(N){
  const NICKS=['cimbom_1905','Ahmet K.','zeynep.ylmz','fenerli_kaan','Elif🌸','Mert34','sarıkanarya07','Burak Aslan','ayse_dmr','UltrAslan','Kerem.FB','selinn','Hakan Çelik','gs_tarafı','Emre Yıldız','merve.k','fener_aşkı','Can B.','Deniz💙','oguz_1907',
    'Büşra Ş.','tolgaa','Arda GS','Nil Ö.','kanarya_hakan','Seda Koç','barış.alper.fan','ece__','Murat Usta','sinan_fb','Gizem','yusuf.34','Melis Aydın','ali_cimbom','Kaan Ö.','Pınar🌙','ilkerr','Cansu B.','Tamer Abi','irem.s',
    'Onur FB','Ufuk','Derya K.','hasan_gs','Nehir','serkan.1907','Buse M.','Volkan','Tuğba','Efe_06','Sevgi T.','Cem Abi','Yağız','Nazlı','Batu','Ozan K.','Gamze','Rıza Amca','Duru','Kemal'];
  const G={gul:['Gül',1],gg:['GG',1],donut:['Donut',30],kalp:['El Kalp',100],gozluk:['Güneş Gözlüğü',199],corgi:['Corgi',299],tab:['Para Tabancası',500]};
  const CHAT=['hadi be','gol olsun artık','😂😂','nasıl oynanıyor?','cimbom!!!','fener ağlama','👏👏','ben de sahaya çıkmak istiyorum','bu oyun güzelmiş','selam herkese','kaç kaç?','🔥🔥🔥'];
  const R=a=>a[Math.floor(Math.random()*a.length)];const viewers=[];const t0=performance.now()/1000;
  for(let i=0;i<N;i++){const name=NICKS[i%NICKS.length]+(i>=NICKS.length?'_'+i:'');const lean=/fb|fener|kanarya|1907|💙/i.test(name)?'fb':/gs|cimbom|aslan|1905/i.test(name)?'gs':(Math.random()<.5?'gs':'fb');
    const r=Math.random();viewers.push({u:{id:'sim_'+i,name,avatar:`https://api.dicebear.com/9.x/avataaars/png?seed=${encodeURIComponent(name)}&size=160&backgroundColor=b6e3f4,c0aede,ffd5dc,ffdfbf`},
      joinAt:i<12?Math.random()*12:8+Math.random()*140,lean,gen:r<.55?0:r<.85?1:r<.96?2:3,in:false,picked:false,pickAt:0,next:0})}
  // garantili akış: her kural en az bir kez görünsün
  const script=[[25,'gift',0,G.donut],[40,'comment',2,'hakem olayım ben'],[44,'gift',2,G.gozluk],[55,'comment',0,'hoca benim'],[58,'gift',0,G.corgi],[65,'gift',5,G.kalp],[80,'gift',1,G.kalp],[95,'gift',13,G.donut],[110,'comment',10,'ben hakem olurum'],[120,'gift',10,G.gozluk],
    [140,'gift',6,G.tab],[170,'gift',16,G.kalp],[185,'gift',4,G.kalp],[200,'gift',24,G.kalp],[215,'gift',3,G.kalp],[230,'gift',7,G.kalp],[250,'gift',9,G.kalp],[270,'gift',19,G.tab],[300,'gift',11,G.corgi]];
  const box=document.createElement('div');box.innerHTML='<div class="sh">SİMÜLASYON · TikTok sohbeti · <span id="simN">0</span> izleyici</div><div id="simLog"></div>';box.id='simchat';document.body.appendChild(box);
  const st=document.createElement('style');st.textContent='#simchat{position:fixed;left:10px;top:10px;bottom:10px;width:300px;background:#111c;border:1px solid #333;border-radius:12px;font:14px Arial,sans-serif;color:#ddd;display:flex;flex-direction:column;z-index:98;overflow:hidden}#simchat .sh{padding:10px;background:#222;font-weight:700;color:#ffe08a}#simLog{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;gap:4px}#simLog div{line-height:1.35}#simLog b{color:#fff}#simLog .g{color:#ff9bd2}#simLog .j{color:#8b96a8}#simLog .big{color:#ffe08a;font-weight:700}';document.head.appendChild(st);
  const log=(h,c)=>{const l=$('#simLog');const d=document.createElement('div');if(c)d.className=c;d.innerHTML=h;l.appendChild(d);while(l.children.length>60)l.firstChild.remove()};
  const send=(v,ev)=>handle({...ev,user:v.u});
  const join=v=>{v.in=true;v.pickAt=performance.now()/1000-t0+3+Math.random()*30;v.next=performance.now()/1000-t0+5+Math.random()*20;log(`<b>${v.u.name}</b> katıldı`,'j');send(v,{type:'join'})};
  const gift=(v,g,n=1)=>{const c=g[1]*n;log(`<b>${v.u.name}</b> ${g[0]}${n>1?' x'+n:''} gönderdi <span class="g">(${c} jeton)</span>`,c>=30?'big':'g');send(v,{type:'gift',coins:c,gift:g[0]})};
  setInterval(()=>{const t=performance.now()/1000-t0;let count=0;
    for(const v of viewers){if(!v.in&&t>=v.joinAt)join(v);if(!v.in)continue;count++;
      if(!v.picked&&t>=v.pickAt){v.picked=true;if(Math.random()<.75){const w=v.lean==='gs'?R(['GS','gs','Cimbom','GS 💛❤️']):R(['FB','fb','Fener','FB 💛💙']);log(`<b>${v.u.name}</b>: ${w}`);send(v,{type:'comment',text:w})}}
      if(t>=v.next){v.next=t+6+Math.random()*25;const r=Math.random();
        if(r<.25){const w=R(CHAT);log(`<b>${v.u.name}</b>: ${w}`);send(v,{type:'comment',text:w})}
        else if(r<.55)send(v,{type:'like',count:1+Math.floor(Math.random()*15)});
        else if(v.gen===1&&r<.75)gift(v,R([G.gul,G.gg]),1+Math.floor(Math.random()*5));
        else if(v.gen===2&&r<.7)gift(v,G.donut);
        else if(v.gen===3&&r<.65)gift(v,G.kalp)}}
    for(const s of script)if(!s.done&&t>=s[0]){s.done=true;const v=viewers[s[2]];if(!v)continue;if(!v.in)join(v);if(s[1]==='comment'){log(`<b>${v.u.name}</b>: ${s[3]}`);send(v,{type:'comment',text:s[3]})}else gift(v,s[3])}
    $('#simN').textContent=count},400)}
if(SIM)startSim(SIM);
window.derbi={handle,S,actors,squad,layout,dropRoles,proj:(x,y,z)=>{const v=new THREE.Vector3(x,y,z).project(camera);return [Math.round((v.x+1)/2*1080),Math.round((1-v.y)/2*1920)]},setCam:(px,py,pz,lx,ly,lz,off,fov)=>{if(fov){camera.fov=fov;camera.updateProjectionMatrix()}CAM_MAIN.pos.set(px,py,pz);CAM_MAIN.look.set(lx,ly,lz);camPos.copy(CAM_MAIN.pos);camLook.copy(CAM_MAIN.look);if(off!=null)camera.setViewOffset(1080,1920,0,off,1080,1920);camera.position.copy(camPos);camera.lookAt(camLook);camera.updateMatrixWorld()}};
</script>
